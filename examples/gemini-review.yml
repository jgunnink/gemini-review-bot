# Standalone setup — copy this into your repo at .github/workflows/gemini-review.yml
name: Gemini code review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Run on PR open, PR comments with /gemini-review, or review comments with /gemini or /gemini-review.
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/gemini-review')) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (contains(github.event.comment.body, '/gemini') ||
        contains(github.event.comment.body, '@gemini')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jgunnink/gemini-review-bot@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          agent_platform_api_key: ${{ secrets.AGENT_PLATFORM_API_KEY || secrets.AGENT_PLATFORM_KEY }}
          # model: gemini-flash-latest                              # optional override
          # instructions: "Flag new modules that ship without tests."  # optional review guidance
